authoring_notes: |
  Change a Kotlin class's field type in place; three unchanged methods
  (`add` / `get` / `size`) must be preserved. Note that the resulting
  code is not type-correct (a Map doesn't have `.add`), but it is
  syntactically valid Kotlin — VAL-101 only parses for structure.

  M12: re-annotated as a single-entry target_batch with
  preserve_siblings=true. FastEdit's chunked_merge resolves `Store`,
  enumerates the three methods via tldr, and splices them back into
  the new class body. Byte-exact, 0 model tokens.

  Prior history: M9 accepted as algorithm-limit because Kotlin fields
  aren't exposed as resolvable top-level symbols. preserve_siblings
  sidesteps the problem — the snippet is the minimal new class shell
  and the unchanged methods are preserved deterministically.
