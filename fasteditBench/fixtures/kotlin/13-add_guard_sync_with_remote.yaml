authoring_notes: |
  Realistic ~55-line Kotlin RepositoryImpl.syncWithRemote with coroutine
  scope + conflict resolution + pull/push cursors. Edit adds a 4-line
  offline-short-circuit guard at the top. FastEdit payload = guard + 2
  anchors + marker; native-edit must echo the whole sync pipeline to anchor.
