name: ruby_extend_literal_role_permissions
pattern: extend_literal
language: ruby
original_code: |
  def build_role_permissions(organization)
      {
          viewer: {
              project: [:read],
              issue: [:read, :comment],
              member: [:read],
              billing: [],
              integration: [:read],
              audit: [],
          },
          contributor: {
              project: [:read, :edit],
              issue: [:read, :create, :update, :comment, :close],
              member: [:read],
              billing: [],
              integration: [:read],
              audit: [],
          },
          admin: {
              project: [:read, :edit, :delete],
              issue: [:read, :create, :update, :comment, :close, :assign, :delete],
              member: [:read, :invite, :remove],
              billing: [:read],
              integration: [:read, :configure],
              audit: organization.tier == "enterprise" ? [:read] : [],
          },
          owner: {
              project: [:read, :edit, :delete, :transfer],
              issue: [:read, :create, :update, :comment, :close, :assign, :delete],
              member: [:read, :invite, :remove, :change_role],
              billing: [:read, :edit],
              integration: [:read, :configure],
              audit: organization.tier == "enterprise" ? [:read] : [],
          },
      }
  end
