authoring_notes: |
  Realistic 4-role RBAC matrix (viewer / contributor / admin / owner).
  Edit adds a 5th role "superadmin" by copying the owner block shape
  and extending each action list. FastEdit's middle-insert marker
  preserves the 4 existing role hashes; native-edit must echo the whole
  38-line hash to anchor the insertion.
