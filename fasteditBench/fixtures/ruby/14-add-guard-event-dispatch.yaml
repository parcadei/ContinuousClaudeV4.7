authoring_notes: |
  Realistic ~35-line EventDispatcher#process method with ActiveRecord
  transaction + 5 event types + unknown fallback + mark_processed.
  Edit adds a 4-line nil/id-check guard at the top. FastEdit payload is
  the guard + 2 anchors + marker; native-edit must echo the whole case
  statement to anchor.
