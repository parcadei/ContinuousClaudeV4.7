authoring_notes: |
  P13 add_branch: insert elsif 70->C into if/elsif chain.

  target_kind=none: the method body contains `if ... end` whose closing
  `end` collides with the method-def `end` in text_match's forward
  scan (both strip to the ambiguous `end`). The deterministic path
  either truncates the if-block or duplicates the `end` depending on
  which one pairs up first. Legacy path handles this correctly.
