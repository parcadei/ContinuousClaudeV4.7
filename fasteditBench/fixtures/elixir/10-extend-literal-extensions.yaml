name: ex_extend_literal_extensions
pattern: extend_literal
language: elixir
original_code: |
  defmodule Indexer do
    @extensions [".py", ".js", ".ts"]

    def extensions, do: @extensions
  end
snippet: |
  @extensions [".py", ".js", ".ts", ".ex", ".exs"]
expected_output: |
  defmodule Indexer do
    @extensions [".py", ".js", ".ts", ".ex", ".exs"]

    def extensions, do: @extensions
  end
target_kind: replace
target_name: Indexer
authoring_notes: |
  P14 extend_literal: add two entries to a module-attribute list. Module
  attributes (@extensions) are Elixir's idiomatic constant form.
