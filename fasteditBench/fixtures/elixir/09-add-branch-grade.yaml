authoring_notes: |
  P13 add_branch: insert a new cond arm for score >= 70 -> "C" between
  the B and F arms. Elixir's `cond` is the canonical multi-branch form.
  Uses symmetric markers around the new arm (plus an explicit cond/end
  frame) so text_match defers to the model — full-replacement Style A
  trips on Elixir's double-`end` ambiguity (cond-end + do-end both
  appear and `_AMBIGUOUS_LINES` misclassifies one as a new line).
