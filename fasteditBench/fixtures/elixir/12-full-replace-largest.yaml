name: ex_full_replace_largest
pattern: full_replace
language: elixir
original_code: |
  defmodule Picker do
    def largest(items) do
      [head | tail] = items

      Enum.reduce(tail, head, fn x, best ->
        if x > best, do: x, else: best
      end)
    end
  end
snippet: |
  def largest(items) do
    Enum.max(items)
  end
expected_output: |
