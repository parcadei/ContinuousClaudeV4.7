name: extend_literal_file_extensions
pattern: extend_literal
language: swift
original_code: |
  let supportedExtensions: [String] = [".swift", ".m", ".h"]
snippet: |
  let supportedExtensions: [String] = [".swift", ".m", ".h", ".mm", ".cpp"]
expected_output: |
  let supportedExtensions: [String] = [".swift", ".m", ".h", ".mm", ".cpp"]
target_kind: replace
target_name: supportedExtensions
authoring_notes: |
  Append two new elements (".mm", ".cpp") to an existing array literal.
  Top-level constant declaration, no enclosing function. Single-line
  array literal to keep formatting unambiguous.
