authoring_notes: |
  Realistic ~50-line NetworkCoordinator.performRequest with retry + backoff
  + 401 refresh + structured error mapping + metrics. Edit adds a 3-line
  task-cancellation guard at the top. FastEdit payload = guard + anchors +
  marker; native must echo the entire retry loop body.

  target_kind=none: Swift's AST-based ``replace=`` path classifies any
  ``let`` inside the body as a top-level symbol and rejects the snippet
  (the same pattern as swift/01-add-guard-average). Falls through to
  FastEdit's legacy full-file merge which handles the preservation via the
  ``// ... existing code ...`` marker on the 1.7B model path. Token accounting
  (v5/v5.1 marker minimization) still applies — this fixture contributes
  to the inline_edit category which is reclassified to modify_inside.
