name: class_method_store_init_swap
pattern: class_method
language: swift
original_code: |
  class Store {
      private var items: [Int]

      init() {
          self.items = []
      }

      func get(_ k: Int) -> Int {
          return items[k]
      }

      func set(_ k: Int, _ v: Int) {
          items[k] = v
      }
  }
