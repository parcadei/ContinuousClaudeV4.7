authoring_notes: |
  Realistic ~50-line bi-directional sync (remote pull -> conflict resolve
  -> local push). Edit inserts a single logger.info at the top. FastEdit's
  payload is the log line + 2 anchors + marker; native must echo the whole
  sync pipeline.

  target_kind=none: same Swift AST limitation as swift/01 and swift/13 —
  ``let``/``var`` declarations inside the body are misinterpreted as
  top-level symbols. Routes through the legacy full-file merge path.
