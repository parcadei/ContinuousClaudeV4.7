  func syncWithRemote() async throws -> SyncReport {
      logger.info("sync.begin")
      let snapshot = try await store.currentSnapshot()
      var pulled: [RemoteRecord] = []
      var pushed: [LocalRecord] = []
      var conflicts: [ConflictResolution] = []

      let remoteChanges = try await remoteAPI.changes(since: snapshot.remoteCursor)
      for change in remoteChanges {
          let local = try await store.local(for: change.id)
          if local == nil {
              try await store.insert(change.asLocalRecord())
              pulled.append(change)
              continue
          }

          guard let existing = local else { continue }
          if existing.updatedAt < change.updatedAt {
              try await store.update(change.asLocalRecord())
              pulled.append(change)
          } else if existing.updatedAt > change.updatedAt {
              let resolution = try conflictResolver.resolve(local: existing, remote: change)
              switch resolution {
              case .keepLocal:
                  pushed.append(existing)
              case .keepRemote:
                  try await store.update(change.asLocalRecord())
                  pulled.append(change)
              case .merge(let merged):
                  try await store.update(merged)
                  pushed.append(merged)
              }
              conflicts.append(resolution)
          }
      }

      let localPending = try await store.pendingSince(snapshot.remoteCursor)
      for record in localPending {
          do {
              try await remoteAPI.push(record)
              pushed.append(record)
          } catch RemoteError.conflict {
              try await remoteAPI.forcePush(record)
              pushed.append(record)
