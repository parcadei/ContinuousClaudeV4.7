authoring_notes: |
  Realistic feature-flag builder (~15 flag entries across multi-tier billing
  logic). Edit appends 3 new flag entries to the dict literal. FastEdit's
  minimal payload is the 3 new lines + marker; native-edit must echo the
  full dict to anchor the insertion point.
