authoring_notes: |
  Realistic 47-line webhook dispatcher (order/payment/refund events with
  retry + notifier). The edit adds a 3-line malformed-event guard at the
  top; FastEdit's 0.2.5 minimal payload is the guard + marker. Native-edit
  must echo the entire dispatch body as old_string to anchor the insertion,
  so the savings are substantial.
