authoring_notes: |
  Realistic 38-line CLI command dispatcher. Edit inserts a brand-new
  'secrets' branch between the 'config' branch and the fallthrough error.
  The middle-insert marker preserves everything above and below; the new
  code is ~6 lines. Large savings because native-edit must anchor on the
  bracketing context.
