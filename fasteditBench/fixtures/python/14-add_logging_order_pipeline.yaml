  def run_order_pipeline(order, store, payments, fulfillment, notifier):
      """Validate, charge, fulfill, and notify for a single order."""
      if not order.get("items"):
          raise ValueError("order has no items")

      subtotal = 0
      for item in order["items"]:
          product = store.get_product(item["sku"])
          if product is None:
              raise ValueError(f"unknown SKU {item['sku']}")
          if product["stock"] < item["quantity"]:
              raise OutOfStockError(item["sku"])
          subtotal += product["price"] * item["quantity"]

      tax = round(subtotal * order.get("tax_rate", 0.0), 2)
      total = subtotal + tax

      charge = payments.charge(
          customer_id=order["customer_id"],
          amount=total,
          idempotency_key=order["id"],
      )
      if charge.status != "succeeded":
          raise PaymentDeclinedError(charge.decline_reason)

      for item in order["items"]:
          store.reserve(item["sku"], item["quantity"])

      shipment = fulfillment.schedule(
          order_id=order["id"],
          items=order["items"],
          address=order["shipping_address"],
      )

      notifier.publish("order.confirmed", {
          "order_id": order["id"],
          "total": total,
          "shipment_id": shipment.id,
      })

      return {
          "order_id": order["id"],
          "subtotal": subtotal,
          "tax": tax,
          "total": total,
          "charge_id": charge.id,
          "shipment_id": shipment.id,
      }
