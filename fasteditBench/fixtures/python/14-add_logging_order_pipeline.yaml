authoring_notes: |
  Realistic 50-line order pipeline (validate -> charge -> reserve -> ship ->
  notify). Edit inserts a single logger.info at the start. Because the
  surrounding function body is large and complex, native-edit must anchor
  with a big old_string region while FastEdit 0.2.5 emits only the new
  logger line + marker.
