name: extend_literal_supported_extensions
pattern: extend_literal
language: python
original_code: |
  SUPPORTED_EXTENSIONS = [".py", ".js", ".ts", ".tsx"]
snippet: |
  SUPPORTED_EXTENSIONS = [".py", ".js", ".ts", ".tsx", ".rs", ".go", ".java"]
expected_output: |
  SUPPORTED_EXTENSIONS = [".py", ".js", ".ts", ".tsx", ".rs", ".go", ".java"]
target_kind: replace
target_name: SUPPORTED_EXTENSIONS
authoring_notes: |
  Adds three entries to a module-level list literal. Single-line change at
  module scope (not inside a function) — exercises the adapter's ability to
  locate a top-level constant without wrapping in a def. A broken adapter
  that only knows how to edit function bodies would fail this case.
