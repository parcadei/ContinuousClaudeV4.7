authoring_notes: |
  Adds a new elif arm between the 'pro' tier and the fallback 'free' return.
  No markers — the snippet rewrites the full chain. Tests whether the adapter
  preserves numeric-literal formatting (underscores in 1_000) and does not
  accidentally re-order the existing branches.
