name: rename_variable_tmp_to_result
pattern: rename_variable
language: csharp
original_code: |
  using System.Collections.Generic;
  using System.Linq;

  public static class Summariser
  {
      public static int Summarise(IEnumerable<int> xs)
      {
          var tmp = xs.Where(x => x > 0).ToList();
          tmp = tmp.Select(x => x * 2).ToList();
          return tmp.Sum();
      }
  }
snippet: |
