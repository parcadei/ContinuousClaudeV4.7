  using Microsoft.AspNetCore.Builder;

  public static class Startup
  {
      public static void Configure(IApplicationBuilder app)
      {
          app.UseRouting();
          app.UseCors();
          app.UseAuthentication();
          app.UseAuthorization();
          app.UseEndpoints(endpoints => { });
      }
  }
