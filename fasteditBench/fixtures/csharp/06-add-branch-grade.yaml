name: add_branch_grade_switch
pattern: add_branch
language: csharp
original_code: |
  public static class Grading
  {
      public static string Grade(int score)
      {
          if (score >= 90) return "A";
          else if (score >= 80) return "B";
          return "F";
      }
  }
snippet: |
  public static string Grade(int score)
  {
      if (score >= 90) return "A";
      else if (score >= 80) return "B";
      else if (score >= 70) return "C";
      return "F";
  }
expected_output: |
  public static class Grading
  {
      public static string Grade(int score)
      {
          if (score >= 90) return "A";
          else if (score >= 80) return "B";
          else if (score >= 70) return "C";
          return "F";
      }
  }
target_kind: replace
target_name: Grading
authoring_notes: |
  Adds a new `else if (score >= 70)` branch to an existing
  if/else-if/else chain. Exercises the `add_branch` pattern on a
  C#-idiomatic guard-style grading method.
