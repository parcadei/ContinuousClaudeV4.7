name: add_at_end_emit_log
pattern: add_at_end
language: csharp
original_code: |
  using Microsoft.Extensions.Logging;

  public class OrderProcessor
  {
      private readonly ILogger<OrderProcessor> _logger;

      public OrderProcessor(ILogger<OrderProcessor> logger)
      {
          _logger = logger;
      }

      public int Process(int orderId)
      {
          var total = Compute(orderId);
          return total;
      }

      private int Compute(int id) => id * 2;
  }
snippet: |
  public int Process(int orderId)
  {
      var total = Compute(orderId);
      _logger.LogInformation("processed {OrderId}", orderId);
      return total;
  }
expected_output: |
  using Microsoft.Extensions.Logging;

  public class OrderProcessor
  {
      private readonly ILogger<OrderProcessor> _logger;

      public OrderProcessor(ILogger<OrderProcessor> logger)
      {
          _logger = logger;
      }

      public int Process(int orderId)
      {
          var total = Compute(orderId);
          _logger.LogInformation("processed {OrderId}", orderId);
          return total;
      }

      private int Compute(int id) => id * 2;
  }
