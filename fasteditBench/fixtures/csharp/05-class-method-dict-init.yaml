name: class_method_store_init
pattern: class_method
language: csharp
original_code: |
  using System.Collections.Generic;

  public class Store
  {
      private List<string> _items;

      public Store()
      {
          _items = new List<string>();
      }

      public string Get(int index)
      {
          return _items[index];
      }

      public void Set(int index, string value)
      {
          _items[index] = value;
      }
  }
