name: add_at_end_log_completion
pattern: add_at_end
language: go
original_code: |
  package pipeline

  import "log"

  func Process(items []string) []string {
      out := make([]string, 0, len(items))
      for _, it := range items {
          out = append(out, transform(it))
      }
      return out
  }

  func transform(s string) string { return s + "!" }
