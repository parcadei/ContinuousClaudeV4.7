authoring_notes: |
  Go's closest analog to "class_method": modify the struct type and its
  constructor while preserving the methods defined on the receiver. The
  trailing `// ... existing code ...` marker covers both `Get` and `Set`.
  Tests that the adapter correctly identifies method receivers as
  part of the "class" for marker-expansion purposes.
