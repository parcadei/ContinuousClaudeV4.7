name: class_method_store_init_map
pattern: class_method
language: go
original_code: |
  package store

  type Store struct {
      items []string
  }

  func NewStore() *Store {
      return &Store{items: []string{}}
  }

  func (s *Store) Get(i int) string {
      return s.items[i]
  }

  func (s *Store) Set(i int, v string) {
      s.items[i] = v
  }
snippet: |
  type Store struct {
      items map[int]string
  }

  func NewStore() *Store {
      return &Store{items: make(map[int]string)}
  }

  // ... existing code ...
expected_output: |
  package store

