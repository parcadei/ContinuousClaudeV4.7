authoring_notes: |
  Realistic ~55-line batch processor with tx, ctx-cancel polling, per-item
  validate/persist/enqueue, and metrics. Edit inserts a single structured-
  log line after the guards. Native-edit tool must echo a multi-line anchor
  region; FastEdit emits just the log line + marker.
