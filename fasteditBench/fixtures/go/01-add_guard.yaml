name: add_guard_empty_slice
pattern: add_guard
language: go
original_code: |
  package mathx

  func Average(nums []float64) float64 {
      total := 0.0
      for _, n := range nums {
          total += n
      }
      return total / float64(len(nums))
  }
snippet: |
