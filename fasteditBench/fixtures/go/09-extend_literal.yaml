name: extend_literal_extensions
pattern: extend_literal
language: go
original_code: |
  package files

  var Extensions = []string{".go", ".py", ".ts"}
snippet: |
  var Extensions = []string{".go", ".py", ".ts", ".rs", ".java"}
expected_output: |
  package files

  var Extensions = []string{".go", ".py", ".ts", ".rs", ".java"}
target_kind: replace
target_name: Extensions
authoring_notes: |
  Add two new entries to a package-level slice literal. Named target lets
  the calling agent use replace=Extensions so FastEdit skips the old
  slice literal in the tool-call payload.
