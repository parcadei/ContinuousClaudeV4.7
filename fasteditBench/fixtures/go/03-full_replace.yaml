name: full_replace_max_int
pattern: full_replace
language: go
original_code: |
  package stats

  func MaxInt(xs []int) int {
      best := xs[0]
      for i := 1; i < len(xs); i++ {
          if xs[i] > best {
              best = xs[i]
          }
      }
      return best
  }
