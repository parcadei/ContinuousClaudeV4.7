target_kind: replace
target_name: HandleRequest
authoring_notes: |
  Realistic ~60-line HTTP handler with trace ID propagation, auth, authz,
  rate limiting, body limit, router, and domain-error unwrap. Edit adds a
  5-line method-allowlist guard at the top. FastEdit's minimal payload is
  the guard + anchor (ctx := r.Context()) + marker; native-edit must echo
  the whole handler body.
