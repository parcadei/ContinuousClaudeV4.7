expected_output: |
  #include <stdio.h>
  #include <stdlib.h>

  char *read_file_contents(const char *path, size_t *out_len) {
      FILE *fp = fopen(path, "rb");
      if (fp == NULL) {
          *out_len = 0;
          return NULL;
      }
      fseek(fp, 0, SEEK_END);
      long size = ftell(fp);
      rewind(fp);
      char *buf = (char *)malloc((size_t)size + 1);
      fread(buf, 1, (size_t)size, fp);
      buf[size] = '\0';
      fclose(fp);
      *out_len = (size_t)size;
      return buf;
  }
target_kind: replace
target_name: read_file_contents
authoring_notes: |
  Wraps (well, prefixes with an error branch — a common C-idiomatic
  way to "wrap" a body without try/catch). The marker preserves the
  entire original body after the new `if (fp == NULL)` early-return
  block.
