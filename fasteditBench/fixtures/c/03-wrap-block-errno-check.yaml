name: wrap_block_fopen_with_errno_check
pattern: wrap_block
language: c
original_code: |
  #include <stdio.h>
  #include <stdlib.h>

  char *read_file_contents(const char *path, size_t *out_len) {
      FILE *fp = fopen(path, "rb");
      fseek(fp, 0, SEEK_END);
      long size = ftell(fp);
      rewind(fp);
      char *buf = (char *)malloc((size_t)size + 1);
      fread(buf, 1, (size_t)size, fp);
      buf[size] = '\0';
      fclose(fp);
      *out_len = (size_t)size;
      return buf;
  }
snippet: |
