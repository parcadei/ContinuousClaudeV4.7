authoring_notes: |
  Two-marker middle-swap refactor, rewritten to Style A (full
  replacement) under replace=run_pipeline. The deterministic
  text-match algorithm handles bracketing markers correctly in simple
  cases but flips the new lines OUTSIDE the preserved gap when the
  snippet contains two `// ... existing code ...` markers sandwiching
  the edit — because the gap-emission loop emits the gap only at the
  first marker and appends all remaining "new" lines after it. Style A
  sidesteps this by giving text_match the full new body explicitly.

  Forward decls live in both original_code and expected_output so
  replace= operates on run_pipeline alone without a spurious delta
  around the surrounding top-level decls.
