name: add_branch_grade_c
pattern: add_branch
language: c
original_code: |
  const char *letter_grade(int score) {
      if (score >= 90) {
          return "A";
      } else if (score >= 80) {
          return "B";
      }
      return "F";
  }
snippet: |
  const char *letter_grade(int score) {
      if (score >= 90) {
          return "A";
      } else if (score >= 80) {
          return "B";
      } else if (score >= 70) {
          return "C";
      }
      return "F";
  }
expected_output: |
  const char *letter_grade(int score) {
      if (score >= 90) {
          return "A";
      } else if (score >= 80) {
          return "B";
      } else if (score >= 70) {
          return "C";
      }
      return "F";
  }
target_kind: replace
target_name: letter_grade
authoring_notes: |
  Adds a new `else if` branch for the "C" grade between the existing
  "B" arm and the fallback. Existing branches are preserved in order.
