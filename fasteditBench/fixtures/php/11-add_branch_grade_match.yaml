name: add_branch_grade_match
pattern: add_branch
language: php
original_code: |
  <?php

  declare(strict_types=1);

  final class Grader
  {
      public function grade(int $score): string
      {
          return match (true) {
              $score >= 90 => 'A',
              $score >= 80 => 'B',
              default => 'F',
          };
      }
  }
