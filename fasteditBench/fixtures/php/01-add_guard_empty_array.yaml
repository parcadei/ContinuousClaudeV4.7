name: add_guard_empty_array
pattern: add_guard
language: php
original_code: |
  <?php

  declare(strict_types=1);

  final class Averager
  {
      public function average(array $nums): float
      {
          $total = array_sum($nums);
          return $total / count($nums);
      }
  }
