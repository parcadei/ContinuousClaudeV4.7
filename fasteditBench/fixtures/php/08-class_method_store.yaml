name: class_method_store
pattern: class_method
language: php
original_code: |
  <?php

  declare(strict_types=1);

  final class Store
  {
      private array $items = [];

      public function add(string $k, mixed $v): void
      {
          $this->items[$k] = $v;
      }

      public function get(string $k): mixed
      {
          return $this->items[$k];
      }

      public function clear(): void
      {
          $this->items = [];
      }
  }
