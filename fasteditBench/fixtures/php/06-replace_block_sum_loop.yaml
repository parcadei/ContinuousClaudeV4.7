name: replace_block_sum_loop
pattern: replace_block
language: php
original_code: |
  <?php

  declare(strict_types=1);

  final class Totalizer
  {
      public function total(array $items): int
      {
          $acc = 0;
          foreach ($items as $i) {
              $acc += $i;
          }
          return $acc;
      }
  }
snippet: |
  public function total(array $items): int
  {
      return array_sum($items);
  }
expected_output: |
  <?php

  declare(strict_types=1);

  final class Totalizer
  {
      public function total(array $items): int
      {
          return array_sum($items);
      }
  }
target_kind: replace
target_name: Totalizer
authoring_notes: |
  Replace a four-line foreach accumulator with a single array_sum call.
  Full-body rewrite within one method; tests that the adapter doesn't
  leak lines from the old foreach body into the new implementation.
