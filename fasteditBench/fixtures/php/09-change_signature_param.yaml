name: change_signature_param
pattern: change_signature
language: php
original_code: |
  <?php

  declare(strict_types=1);

  final class Incrementer
  {
      public function bump(int $x): int
      {
          return $x + 1;
      }
  }
snippet: |
  public function bump(int $x, int $by = 0): int
  {
      return $x + 1;
  }
expected_output: |
  <?php

  declare(strict_types=1);

  final class Incrementer
  {
      public function bump(int $x, int $by = 0): int
      {
          return $x + 1;
      }
  }
target_kind: replace
target_name: bump
authoring_notes: |
  Change method signature: add `int $by = 0` default parameter. Body is
  unchanged. Adapter must NOT change `return $x + 1;` even though
  semantically it ignores the new parameter. M8: rewritten as Style A
  (full-method replacement, no markers) and re-annotated from
  target_kind=none to target_kind=replace/target_name=bump so
  FastEdit's direct-swap fast path captures it with zero model tokens.
