target_kind: replace
target_name: buildLocalizedErrorMessages
authoring_notes: |
  Realistic localized error-message builder (~11 existing entries). Edit
  appends 3 new entries before the return. FastEdit's 0.2.5 middle-insert
  preserves the leading 11 entries via marker; payload is just the 3 new
  multi-line entries + anchor. Native-edit must echo the full 22-line
  dictionary to anchor the insertion.
