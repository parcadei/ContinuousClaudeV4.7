authoring_notes: |
  Realistic ~45-line PaymentProcessor.processRefund method with saga
  orchestration (reserve -> gateway -> ledger -> notify) and compensation.
  Edit adds a 3-line argument-validation guard at the top. FastEdit's
  minimal payload is the guard + 2 anchor lines + marker; native-edit must
  echo the entire saga body to anchor.
