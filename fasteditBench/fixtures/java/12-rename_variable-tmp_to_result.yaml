name: rename_variable_tmp_to_result
pattern: rename_variable
language: java
original_code: |
  public class Pipeline {
      public int run(java.util.List<Integer> xs) {
          int tmp = 0;
          for (int x : xs) {
              tmp = tmp + x;
          }
          tmp = tmp * 2;
          return tmp;
      }
  }
