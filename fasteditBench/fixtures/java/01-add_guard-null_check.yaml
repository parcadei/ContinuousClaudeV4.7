authoring_notes: |
  Classic Java guard-clause insertion: check null/empty before the body.
  Snippet uses a `// ... existing code ...` marker to preserve the for-loop
  and the return. A correct adapter keeps the loop and return untouched
  and only inserts the 3-line guard.
