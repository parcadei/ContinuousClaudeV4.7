expected_output: |
  public class Averager {
      public double average(java.util.List<Integer> nums) {
          if (nums == null || nums.isEmpty()) {
              return 0.0;
          }
          int total = 0;
          for (int n : nums) {
              total += n;
          }
          return (double) total / nums.size();
      }
  }
