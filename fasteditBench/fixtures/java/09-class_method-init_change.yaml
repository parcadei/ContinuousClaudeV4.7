name: class_method_init_change
pattern: class_method
language: java
original_code: |
  public class Store {
      private java.util.List<String> items;

      public Store() {
          this.items = new java.util.ArrayList<>();
      }

      public String get(int k) {
          return this.items.get(k);
      }

      public void set(int k, String v) {
          this.items.set(k, v);
      }
  }
