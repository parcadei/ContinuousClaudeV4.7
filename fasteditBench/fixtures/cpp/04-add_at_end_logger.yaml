name: add_at_end_logger
pattern: add_at_end
language: cpp
original_code: |
  #include <string>
  #include <iostream>

  std::string process(const std::string& input) {
      std::string result;
      result.reserve(input.size());
      for (char c : input) {
          result.push_back(std::toupper(static_cast<unsigned char>(c)));
      }
      return result;
  }
snippet: |
