name: extend_literal_extensions
pattern: extend_literal
language: cpp
original_code: |
  #include <array>
  #include <string_view>

  constexpr std::array<std::string_view, 3> EXTENSIONS = {
      ".cpp", ".hpp", ".cc"
  };
snippet: |
  constexpr std::array<std::string_view, 5> EXTENSIONS = {
      ".cpp", ".hpp", ".cc", ".cxx", ".hh"
  };
expected_output: |
  #include <array>
  #include <string_view>

  constexpr std::array<std::string_view, 5> EXTENSIONS = {
      ".cpp", ".hpp", ".cc", ".cxx", ".hh"
  };
target_kind: replace
target_name: EXTENSIONS
authoring_notes: |
  Extend a constexpr std::array initializer list and bump its declared
  size. Tests that the adapter updates both the template argument (3 -> 5)
  and the brace-enclosed initializer contents consistently.

  M9: annotated as replace=EXTENSIONS — tldr resolves the constant
  definition cleanly, and the snippet is the full new declaration.
  Direct-swap fires, 0 model tokens.
