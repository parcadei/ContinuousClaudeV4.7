name: add_decorator_nodiscard
pattern: add_decorator
language: cpp
original_code: |
  #include <vector>

  int sum(const std::vector<int>& items) {
      int total = 0;
      for (int x : items) {
          total += x;
      }
      return total;
  }
snippet: |
  [[nodiscard]] int sum(const std::vector<int>& items) {
      int total = 0;
      for (int x : items) {
          total += x;
      }
      return total;
  }
expected_output: |
  #include <vector>

