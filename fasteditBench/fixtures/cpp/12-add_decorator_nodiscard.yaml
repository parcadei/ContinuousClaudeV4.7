target_kind: replace
target_name: sum
authoring_notes: |
  C++ attribute analogue of the "add_decorator" pattern — prepend
  [[nodiscard]] to the function declaration.

  M9: rewritten as Style A — snippet is the complete new definition of
  `sum` (markers removed). replace=sum routes direct-swap with 0 model
  tokens.
