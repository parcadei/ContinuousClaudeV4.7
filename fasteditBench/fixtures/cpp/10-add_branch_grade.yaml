name: add_branch_grade
pattern: add_branch
language: cpp
original_code: |
  #include <string>

  std::string grade(int score) {
      if (score >= 90) {
          return "A";
      } else if (score >= 80) {
          return "B";
      }
      return "F";
  }
snippet: |
