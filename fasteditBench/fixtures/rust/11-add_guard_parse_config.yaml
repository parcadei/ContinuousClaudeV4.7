authoring_notes: |
  Realistic 45-line TOML config parser (IO -> parse -> section extraction ->
  defaults -> unknown-key warn). Edit adds a 3-line pre-check guard that
  returns NotFound early. FastEdit 0.2.5 minimal payload = guard + context
  anchor (let raw) + marker. Native-edit must echo the whole body.
