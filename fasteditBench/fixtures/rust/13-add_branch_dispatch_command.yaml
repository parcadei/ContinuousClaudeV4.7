original_code: |
  pub async fn dispatch_command(
      cmd: Command,
      ctx: &CommandContext,
      store: &Store,
      telemetry: &Telemetry,
  ) -> Result<CommandOutcome, CommandError> {
      telemetry.record_command_received(&cmd);

      match cmd {
          Command::Deploy { target, dry_run } => {
              let handler = DeployHandler::new(store);
              let outcome = handler.run(target, dry_run).await?;
              telemetry.record_deploy_completed(&outcome);
              Ok(outcome)
          }
          Command::Rollback { version } => {
              let handler = RollbackHandler::new(store);
              handler.run(version).await
          }
          Command::Status { verbose } => {
              let handler = StatusHandler::new(store);
              let info = handler.run(verbose).await?;
              if verbose {
                  tracing::info!(?info, "status");
              }
              Ok(CommandOutcome::Status(info))
          }
          Command::Logs { service, tail, follow } => {
              let handler = LogsHandler::new(store);
              handler.run(service, tail, follow).await
          }
          Command::Config { subcommand } => {
              let handler = ConfigHandler::new(store);
              handler.run(subcommand, ctx).await
          }
          Command::Unknown(name) => {
              telemetry.record_unknown_command(&name);
              Err(CommandError::Unknown(name))
          }
      }
  }
