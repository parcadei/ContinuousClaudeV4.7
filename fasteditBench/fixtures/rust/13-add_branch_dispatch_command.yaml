authoring_notes: |
  Realistic async command dispatcher (match on Command enum, 5 variants +
  Unknown). Edit inserts a new `Secrets` variant branch between `Config`
  and `Unknown`. FastEdit's 0.2.5 middle-insert preserves both halves via
  a single marker + anchors; native-edit echoes everything.
