authoring_notes: |
  Realistic error-code registry (5 existing entries, ~56 lines). Edit
  appends 2 new entries before the `map` return. Middle-insert marker
  preserves the leading 5 entries. Large savings because FastEdit only
  sends the 2 new 10-line entries plus anchors.
