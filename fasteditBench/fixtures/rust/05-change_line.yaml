name: change_line_timeout_bump
pattern: change_line
language: rust
original_code: |
  async fn fetch(url: &str) -> Result<String, reqwest::Error> {
      let client = reqwest::Client::builder()
          .timeout(std::time::Duration::from_secs(5))
          .build()?;
      client.get(url).send().await?.text().await
  }
snippet: |
