authoring_notes: |
  Rust uses `impl` blocks rather than class syntax, but `class_method`
  still applies semantically: we modify the struct definition + one
  method (`new`) while leaving the other two methods (`get`, `set`)
  untouched via a trailing `// ... existing code ...` marker.
  Intentionally, the `get`/`set` methods are NOT updated to use
  HashMap APIs — that cascading edit would be a separate case. This
  fixture tests targeted method-level edits, not refactor propagation.
