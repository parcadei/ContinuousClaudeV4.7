name: ts_extend_literal_build_permissions
pattern: extend_literal
language: typescript
original_code: |
  export function buildPermissionMatrix(
    role: Role,
    subscriptionTier: SubscriptionTier,
    featureFlags: FeatureFlags,
  ): PermissionMatrix {
    const matrix: PermissionMatrix = {
      "project.view": true,
      "project.edit": role !== "viewer",
      "project.delete": role === "owner" || role === "admin",
      "project.transfer": role === "owner",
      "issue.view": true,
      "issue.create": role !== "viewer",
      "issue.assign": role === "admin" || role === "owner",
      "issue.close": role !== "viewer",
      "issue.delete": role === "owner" || role === "admin",
      "member.invite": role === "admin" || role === "owner",
      "member.remove": role === "owner",
      "member.change_role": role === "owner",
      "billing.view": role === "owner" || role === "admin",
      "billing.edit": role === "owner",
      "integration.view": true,
      "integration.configure":
        (role === "admin" || role === "owner") &&
        subscriptionTier !== "free",
      "export.csv": subscriptionTier !== "free",
      "export.bulk":
        subscriptionTier === "enterprise" && featureFlags.bulkExport === true,
      "audit.view": subscriptionTier === "enterprise" && role === "owner",
    };

    if (featureFlags.adminOverride && role === "owner") {
      for (const key of Object.keys(matrix) as Array<keyof PermissionMatrix>) {
        matrix[key] = true;
      }
    }

    return matrix;
  }
