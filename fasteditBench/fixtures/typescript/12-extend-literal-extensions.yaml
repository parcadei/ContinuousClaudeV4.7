authoring_notes: |
  Add two items to a `readonly string[]` module-level literal. The
  entire const declaration fits on one line, so the "snippet" is the
  full replacement line — no marker needed. Exercises top-level
  (non-function-scoped) extend_literal with a TS-specific `readonly`
  type.
