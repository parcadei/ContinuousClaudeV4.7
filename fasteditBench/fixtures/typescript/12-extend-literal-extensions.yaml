name: ts_extend_literal_extensions
pattern: extend_literal
language: typescript
original_code: |
  export const EXTENSIONS: readonly string[] = [".ts", ".tsx", ".js"];
snippet: |
  export const EXTENSIONS: readonly string[] = [".ts", ".tsx", ".js", ".mjs", ".cjs"];
expected_output: |
  export const EXTENSIONS: readonly string[] = [".ts", ".tsx", ".js", ".mjs", ".cjs"];
target_kind: replace
