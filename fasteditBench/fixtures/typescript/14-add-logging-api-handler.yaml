target_name: handleApiRequest
authoring_notes: |
  Realistic ~55-line API request handler (router match -> auth -> rate limit
  -> body validation -> dispatch -> error boundary). Edit inserts a single
  structured-log line right after traceId derivation. Native tool would echo
  the full header region to anchor; FastEdit emits just the log line + marker.
