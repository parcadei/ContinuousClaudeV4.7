  export function useAuthenticatedQuery<T>(
    key: string,
    fetcher: (token: string) => Promise<T>,
    options: UseAuthenticatedQueryOptions<T> = {},
  ): QueryResult<T> {
    if (!key) {
      throw new Error("useAuthenticatedQuery: key must be a non-empty string");
    }
    const auth = useAuth();
    const [data, setData] = useState<T | null>(options.initialData ?? null);
    const [error, setError] = useState<Error | null>(null);
    const [loading, setLoading] = useState<boolean>(false);
    const [refetchIndex, setRefetchIndex] = useState(0);
    const abortRef = useRef<AbortController | null>(null);

    useEffect(() => {
      let cancelled = false;
      const controller = new AbortController();
      abortRef.current = controller;
      setLoading(true);

      (async () => {
        try {
          let token = await auth.getAccessToken();
          let attempt = 0;
          while (attempt < (options.maxRetries ?? 2)) {
            try {
              const result = await fetcher(token);
              if (cancelled) return;
              setData(result);
              setError(null);
              options.onSuccess?.(result);
              return;
            } catch (err) {
              if (err instanceof UnauthorizedError && attempt === 0) {
                token = await auth.refreshAccessToken();
                attempt += 1;
                continue;
              }
              throw err;
            }
          }
        } catch (err) {
          if (cancelled) return;
          const normalized = err instanceof Error ? err : new Error(String(err));
          setError(normalized);
          options.onError?.(normalized);
        } finally {
          if (!cancelled) setLoading(false);
        }
      })();

      return () => {
        cancelled = true;
        controller.abort();
      };
    }, [key, refetchIndex]);

    const refetch = useCallback(() => setRefetchIndex((i) => i + 1), []);
    return { data, error, loading, refetch };
  }
