authoring_notes: |
  Realistic ~60-line React hook that orchestrates token fetch, 401 refresh,
  retry, and abort-on-unmount. The edit adds a 3-line null-key guard at the
  top. FastEdit's 0.2.5 payload is just the guard + short marker; native
  must echo most of the hook body to anchor the insertion point.
