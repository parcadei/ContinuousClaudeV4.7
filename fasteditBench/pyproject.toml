[project]
name = "fasteditBench"
version = "0.1.0"
description = "Benchmark harness for FastEdit"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "fastedit",
    "httpx>=0.27.0",
    "mcp>=1.27.0",
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",
    "python-dotenv>=1.0.0",
    "pytest-timeout>=2.4.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7.0",
    "tree-sitter>=0.22",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-elixir>=0.3.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-kotlin>=1.0.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-swift",
    "tree-sitter-typescript>=0.23.0",
    "uvicorn[standard]",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
fasteditbench = "fasteditbench.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that load the real MLX model or otherwise take >5s (deselect with '-m \"not slow\"').",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.uv.sources]
fastedit = { path = "../../FastEdit", editable = true }
